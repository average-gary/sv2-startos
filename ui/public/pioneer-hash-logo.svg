<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="Pioneer Hash">
  <!-- Hex frame: hash symbol meets mission patch. Pointed top hex (mountain reference). -->
  <path d="M32 3 L57 17 V47 L32 61 L7 47 V17 Z"
        stroke="currentColor" stroke-width="2.25"
        stroke-linejoin="round" fill="none"/>

  <!-- Inner ridge — second hex, hairline -->
  <path d="M32 9 L52 20 V44 L32 55 L12 44 V20 Z"
        stroke="currentColor" stroke-width="0.75"
        stroke-linejoin="round" fill="none" opacity="0.55"/>

  <!-- Mountain peak — the "pioneer" frontier mark -->
  <path d="M16 41 L25 28 L31 35 L40 22 L48 41 Z"
        stroke="currentColor" stroke-width="1.5"
        stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- North star above the peak (cardinal direction, sextant fix) -->
  <circle cx="40" cy="16" r="1.25" fill="currentColor"/>

  <!-- Hash bars — two horizontal, two vertical, classic # split by the mountain ridge.
       Drawn only on the parts that aren't covered by the mountain so it reads as integrated. -->
  <line x1="20" y1="46" x2="44" y2="46"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="42" y2="50"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
